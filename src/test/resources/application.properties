# =========================================================
# H2 Database
# =========================================================
spring.datasource.url=jdbc:h2:mem:batchtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =========================================================
# JPA
# =========================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =========================================================
# Spring Batch
# =========================================================
spring.batch.jdbc.initialize-schema=always

# ????????
# ?????? Spring Boot launch Job ??? ApplicationContext start
spring.batch.job.enabled=false

# ========================================
# Batch Input
# ========================================

batch.input.list-a=${BATCH_INPUT_LIST_A:input/listA.csv}
batch.input.list-b=${BATCH_INPUT_LIST_B:input/listB.csv}

# ========================================
# Batch Output
# ========================================

batch.output.matched=${BATCH_OUTPUT_MATCHED:output/matched.csv}
batch.output.missing-in-a=${BATCH_OUTPUT_MISSING_IN_A:output/missing-in-a.csv}
batch.output.missing-in-b=${BATCH_OUTPUT_MISSING_IN_B:output/missing-in-b.csv}
batch.output.error=${BATCH_OUTPUT_ERROR:output/error.csv}
